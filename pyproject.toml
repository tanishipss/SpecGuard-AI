[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by the formatter, not worth failing CI over.
# B008: FastAPI's `Depends(...)` in a default argument is the documented,
# idiomatic pattern — not the antipattern this rule is meant to catch.
ignore = ["E501", "B008"]
